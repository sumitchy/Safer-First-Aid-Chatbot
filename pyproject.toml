[project]
name = "safer-firstaid-chatbot"
version = "0.1.0"
description = "Safer First-Aid Chatbots: Reducing Guideline-Discordant Advice Through Retrieval-Augmented Generation"
authors = [{ name = "Sumit Chaudhary", email = "24161337@arden.ac.uk" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core RAG
    "sentence-transformers>=2.6.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Document ingestion
    "pypdf>=4.0.0",
    "langchain-text-splitters>=0.2.0",
    # LLM backends (all optional / pluggable)
    "ollama>=0.2.0",
    "google-generativeai>=0.5.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "accelerate>=0.30.0",
    # Intent classifier baseline
    "scikit-learn>=1.4.0",
    # Evaluation
    "sacrebleu>=2.4.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "nltk>=3.8.0",
    # Config & CLI
    "pyyaml>=6.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.4.0"]
ui = ["streamlit>=1.35.0"]

[project.scripts]
safer-firstaid = "safer_firstaid.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
