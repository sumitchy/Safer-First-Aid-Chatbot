# Ablation: retriever.chunk_size = 1200 (vs default 800). Fixed backend:
# LM Studio qwen/qwen3-vl-8b. All other settings match
# configs/lmstudio_qwen.yaml so this isolates chunk_size.

llm:
  provider: lmstudio
  model: qwen/qwen3-vl-8b
  base_url: http://localhost:1234/v1
  temperature: 0.2
  max_tokens: 2048

retriever:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 1200
  chunk_overlap: 150
  top_k: 4

paths:
  guidelines_dir: data/guidelines/real
  index_dir: data/processed/ablation_chunk1200_index
  scenarios: data/datasets/scenarios.json
  intents: data/datasets/intents.json
  results_dir: results/ablation_chunk1200
