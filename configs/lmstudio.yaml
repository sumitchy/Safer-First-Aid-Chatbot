# Configuration for using LM Studio as the local LLM backend.
#
# Setup:
#   1. Open LM Studio, download a model (e.g. Mistral 7B Instruct v0.3).
#   2. Go to the Developer / Server tab, load the model there, click "Start Server".
#   3. Confirm it is running at the base_url below.
#   4. Find the exact model id:  curl http://192.168.1.79:1234/v1/models
#   5. Put that id in `model` below (it often has a quantization suffix).

llm:
  provider: lmstudio
  model: google/gemma-4-e4b
  base_url: http://192.168.1.79:1234/v1
  temperature: 0.2
  max_tokens: 2048   # gemma-4-e4b is a reasoning model; it spends tokens on
                     # reasoning_content before content, so 512 truncates to empty

retriever:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 800
  chunk_overlap: 150
  top_k: 4

paths:
  guidelines_dir: data/guidelines/real
  index_dir: data/processed/real_faiss_index
  scenarios: data/datasets/scenarios.json
  intents: data/datasets/intents.json
  results_dir: results/lmstudio
