# Configuration for using LM Studio as the local LLM backend.
#
# Setup:
#   1. Open LM Studio, download a model (e.g. Mistral 7B Instruct v0.3).
#   2. Go to the Developer / Server tab, load the model there, click "Start Server".
#   3. Confirm it is running at http://localhost:1234/v1
#   4. Find the exact model id:  curl http://localhost:1234/v1/models
#   5. Put that id in `model` below (it often has a quantization suffix).

llm:
  provider: lmstudio
  model: local-model        # replace with the id from GET /v1/models
  temperature: 0.2
  max_tokens: 512

retriever:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 800
  chunk_overlap: 150
  top_k: 4

paths:
  guidelines_dir: data/guidelines
  index_dir: data/processed/faiss_index
  scenarios: data/datasets/scenarios.json
  intents: data/datasets/intents.json
  results_dir: results
