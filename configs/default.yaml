# Default configuration for the Safer First-Aid Chatbots project.
# Copy this file and edit for your own experiments. Record the config you used
# alongside each results run for reproducibility (thesis requirement).

llm:
  # provider: ollama | gemini | huggingface
  provider: huggingface
  # model: leave blank to use the backend default, or specify e.g.:
  #   ollama:       mistral | llama3 | phi3
  #   gemini:       gemini-1.5-flash | gemini-1.5-pro
  #   huggingface:  Qwen/Qwen2.5-0.5B-Instruct | google/flan-t5-base
  model: null
  temperature: 0.2      # low = deterministic, safer for first aid
  max_tokens: 512

retriever:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  # For a fully offline smoke test with no downloads, set: hashing
  chunk_size: 800
  chunk_overlap: 150
  top_k: 4

paths:
  guidelines_dir: data/guidelines
  index_dir: data/processed/faiss_index
  scenarios: data/datasets/scenarios.json
  intents: data/datasets/intents.json
  results_dir: results
